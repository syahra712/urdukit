[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urdukit"
version = "0.1.0"
description = "A modern, dependency-free NLP toolkit for Urdu: normalization, tokenization, stemming and transliteration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Syed Ahnaf Raza", email = "syahra2014@gmail.com" }]
keywords = [
    "urdu", "nlp", "natural-language-processing", "tokenization",
    "normalization", "transliteration", "roman-urdu", "low-resource",
    "text-processing", "linguistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Urdu",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

# Intentionally empty. See the design note in src/urdukit/__init__.py:
# an unconditional heavy import is what made the previous de-facto Urdu
# library uninstallable in practice.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/syahra712/urdukit"
Repository = "https://github.com/syahra712/urdukit"
Issues = "https://github.com/syahra712/urdukit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/urdukit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
