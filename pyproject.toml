[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "urdukit"
dynamic = ["version"]
description = "A modern, dependency-free NLP toolkit for Urdu: normalization, tokenization, stemming and transliteration."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Ahnaf Raza", email = "syahra2014@gmail.com" }]
keywords = [
    "urdu", "nlp", "natural-language-processing", "tokenization",
    "normalization", "transliteration", "roman-urdu", "low-resource",
    "text-processing", "linguistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Urdu",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

# Intentionally empty. See the design note in src/urdukit/__init__.py:
# an unconditional heavy import is what made the previous de-facto Urdu
# library uninstallable in practice.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/syahra712/urdukit"
Repository = "https://github.com/syahra712/urdukit"
Issues = "https://github.com/syahra712/urdukit/issues"
Changelog = "https://github.com/syahra712/urdukit/blob/main/CHANGELOG.md"

# One source of truth for the version: the package itself.
[tool.hatch.version]
path = "src/urdukit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/urdukit"]

[tool.pytest.ini_options]
# src is collected too so the examples in docstrings are run as tests: a
# documented example that has stopped being true is a bug.
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = "--doctest-modules"

[tool.mypy]
strict = true
files = ["src/urdukit"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    # RUF001/2/3 flag "ambiguous" Unicode -- characters that resemble Latin
    # ones. They exist to catch homoglyph attacks in source code. This is an
    # Urdu library: Urdu text in string literals, docstrings and comments is
    # the entire point, and these rules fire 168 times on correct code.
    "RUF001", "RUF002", "RUF003",
    # __all__ is grouped by submodule with comments, which is more useful to
    # a reader than alphabetical order.
    "RUF022",
]
